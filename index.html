<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postcard — Turn memories into keepsakes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Caveat:wght@400;600&family=Roboto+Mono:wght@400;500&family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app" id="app">

    <!-- Upload Screen -->
    <section class="screen upload-screen active" id="uploadScreen">
        <div class="upload-hero">
            <h1>Postcard</h1>
            <p class="tagline">Turn your favorite moments into keepsakes</p>
            <div class="upload-zone" id="uploadZone">
                <div class="upload-zone-inner">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <rect x="4" y="8" width="40" height="32" rx="4" stroke="currentColor" stroke-width="2.5"/>
                            <circle cx="16" cy="20" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M4 32l10-10 8 8 6-6 16 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="upload-label">Drop your photo here</span>
                    <span class="upload-sublabel">or click to browse</span>
                    <div class="upload-hints">
                        <span>Paste from clipboard</span>
                        <span class="dot"></span>
                        <span>JPG, PNG, WebP</span>
                    </div>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
    </section>

    <!-- Editor Screen -->
    <section class="screen editor-screen" id="editorScreen">
        <nav class="editor-nav">
            <button class="nav-back" id="navBack" title="Start over">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <span class="nav-title">Postcard</span>
            <div class="nav-actions">
                <button class="nav-btn" id="btnFlip" title="Flip postcard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
                    <span>Flip</span>
                </button>
                <button class="nav-btn" id="btnPrint" title="Print postcard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    <span>Print</span>
                </button>
                <button class="nav-btn" id="btnShare" title="Share postcard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
                    <span>Share</span>
                </button>
                <button class="nav-btn accent" id="btnDownload" title="Download postcard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    <span>Save</span>
                </button>
            </div>
        </nav>

        <div class="editor-body">
            <div class="preview-area">
                <div class="postcard-wrapper" id="postcardWrapper">
                    <div class="postcard-scene">
                        <div class="postcard-card" id="postcardCard">
                            <div class="postcard-face postcard-front" id="postcardFront">
                                <div class="postcard-image-container" id="imageContainer">
                                    <img id="postcardImage" class="postcard-image" alt="Your memory">
                                </div>
                                <div class="postcard-text-overlay" id="textOverlay"></div>
                                <div class="postcard-stamp" id="postcardStamp">
                                    <div class="stamp-inner">POSTCARD</div>
                                </div>
                            </div>
                            <div class="postcard-face postcard-back" id="postcardBack">
                                <div class="back-left">
                                    <div class="back-message" id="backMessage">Write your message here...</div>
                                </div>
                                <div class="back-divider"></div>
                                <div class="back-right">
                                    <div class="back-stamp-area">
                                        <div class="back-stamp-box"><span>STAMP</span></div>
                                    </div>
                                    <div class="back-address-lines">
                                        <div class="address-line"></div>
                                        <div class="address-line"></div>
                                        <div class="address-line"></div>
                                        <div class="address-line short"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="image-controls" id="imageControls">
                    <button class="img-ctrl-btn" id="btnZoomOut" title="Zoom out">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
                    </button>
                    <input type="range" id="imageZoom" min="100" max="300" value="100" class="zoom-slider">
                    <button class="img-ctrl-btn" id="btnZoomIn" title="Zoom in">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>
                    </button>
                    <span class="ctrl-sep"></span>
                    <button class="img-ctrl-btn" id="btnResetImage" title="Reset position">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
                    </button>
                </div>
            </div>

            <aside class="controls-panel" id="controlsPanel">
                <div class="tab-bar">
                    <button class="tab active" data-tab="themes">Themes</button>
                    <button class="tab" data-tab="text">Text</button>
                    <button class="tab" data-tab="adjust">Adjust</button>
                </div>

                <div class="tab-content active" id="tab-themes">
                    <div class="theme-grid" id="themeGrid"></div>
                </div>

                <div class="tab-content" id="tab-text">
                    <div class="control-group">
                        <label>Front Message</label>
                        <textarea id="textInput" placeholder="Wish you were here..." rows="3"></textarea>
                    </div>
                    <div class="control-group">
                        <label>Font</label>
                        <select id="fontSelect">
                            <option value="'Caveat', cursive">Handwritten</option>
                            <option value="'Playfair Display', serif">Elegant</option>
                            <option value="'Inter', sans-serif">Modern</option>
                            <option value="'DM Serif Display', serif">Classic</option>
                            <option value="'Space Grotesk', sans-serif">Clean</option>
                            <option value="'Roboto Mono', monospace">Typewriter</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <div class="control-group">
                            <label>Color</label>
                            <input type="color" id="textColor" value="#ffffff">
                        </div>
                        <div class="control-group">
                            <label>Size</label>
                            <input type="range" id="fontSize" min="14" max="64" value="28">
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Text Style</label>
                        <div class="option-row">
                            <button class="opt-btn active" data-textbg="none">None</button>
                            <button class="opt-btn" data-textbg="shadow">Shadow</button>
                            <button class="opt-btn" data-textbg="box">Box</button>
                            <button class="opt-btn" data-textbg="blur">Frosted</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Position</label>
                        <div class="position-grid">
                            <button data-pos="top-left">&#8598;</button>
                            <button data-pos="top-center">&#8593;</button>
                            <button data-pos="top-right">&#8599;</button>
                            <button data-pos="center-left">&#8592;</button>
                            <button data-pos="center" class="active">&#9679;</button>
                            <button data-pos="center-right">&#8594;</button>
                            <button data-pos="bottom-left">&#8601;</button>
                            <button data-pos="bottom-center">&#8595;</button>
                            <button data-pos="bottom-right">&#8600;</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Back Message</label>
                        <textarea id="backTextInput" placeholder="Dear friend, thinking of you..." rows="3"></textarea>
                    </div>
                </div>

                <div class="tab-content" id="tab-adjust">
                    <div class="control-group">
                        <label>Filter</label>
                        <div class="option-row wrap">
                            <button class="opt-btn active" data-filter="none">None</button>
                            <button class="opt-btn" data-filter="grayscale">B&W</button>
                            <button class="opt-btn" data-filter="sepia">Sepia</button>
                            <button class="opt-btn" data-filter="warm">Warm</button>
                            <button class="opt-btn" data-filter="cool">Cool</button>
                            <button class="opt-btn" data-filter="vintage">Vintage</button>
                            <button class="opt-btn" data-filter="fade">Fade</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Orientation</label>
                        <div class="option-row">
                            <button class="opt-btn active" data-orientation="landscape">Landscape</button>
                            <button class="opt-btn" data-orientation="portrait">Portrait</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Border</label>
                        <div class="option-row wrap">
                            <button class="opt-btn active" data-border="none">None</button>
                            <button class="opt-btn" data-border="simple">Simple</button>
                            <button class="opt-btn" data-border="thick">Thick</button>
                            <button class="opt-btn" data-border="rounded">Round</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Brightness</label>
                        <input type="range" id="brightness" min="50" max="150" value="100">
                    </div>
                    <div class="control-group">
                        <label>Contrast</label>
                        <input type="range" id="contrast" min="50" max="150" value="100">
                    </div>
                    <div class="control-group">
                        <label>Saturation</label>
                        <input type="range" id="saturation" min="0" max="200" value="100">
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <h3>Share your postcard</h3>
            <div class="share-options">
                <button class="share-btn" id="shareCopy">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    <span>Copy image</span>
                </button>
                <button class="share-btn" id="shareNative">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
                    <span>Share...</span>
                </button>
                <button class="share-btn" id="sharePng">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    <span>Save PNG</span>
                </button>
                <button class="share-btn" id="shareJpg">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    <span>Save JPG</span>
                </button>
            </div>
            <div class="share-toast" id="shareToast">Copied to clipboard!</div>
        </div>
    </div>

    <!-- Download Modal -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal modal-sm">
            <button class="modal-close" id="dlModalClose">&times;</button>
            <h3>Save your postcard</h3>
            <div class="dl-options">
                <button class="dl-btn" id="dlPng">
                    <span class="dl-format">PNG</span>
                    <span class="dl-desc">Lossless, best quality</span>
                </button>
                <button class="dl-btn" id="dlJpg">
                    <span class="dl-format">JPG</span>
                    <span class="dl-desc">Smaller file size</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
